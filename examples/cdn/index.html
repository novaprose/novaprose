<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaProse from a CDN</title>
    <!-- No build step: the element and its styles straight from the CDN. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@novaprose/web-component@0.9/dist/novaprose.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@novaprose/web-component@0.9/dist/novaprose.global.js"></script>
    <style>
      body {
        max-width: 820px;
        margin: 32px auto;
        padding: 0 16px;
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      pre {
        white-space: pre-wrap;
        background: #f6f8fa;
        padding: 12px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>A rich text field in a plain form</h1>
    <form id="form">
      <novaprose-editor
        name="body"
        required
        toolbar="undo redo | blocks | bold italic link | bullist numlist"
      >
        <p>
          Markup inside the tag is the initial content. Edit it and press <strong>Send</strong>.
        </p>
      </novaprose-editor>
      <p><button>Send</button> <button type="reset">Reset</button></p>
    </form>
    <h2>What the form sends</h2>
    <pre id="sent">—</pre>
    <script>
      // The element is a real form field: its HTML is in FormData under its name.
      document.getElementById('form').addEventListener('submit', (event) => {
        event.preventDefault();
        document.getElementById('sent').textContent = new FormData(event.target).get('body');
      });
    </script>
  </body>
</html>

# Автоматические PR с обновлениями зависимостей. Мелкие обновления сгруппированы, чтобы не
# заваливать репозиторий: один PR в неделю на группу. Каждый PR проходит полный CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      prosemirror:
        patterns: ['prosemirror-*', 'y-prosemirror', 'yjs', '@hocuspocus/*']
      frameworks:
        patterns:
          ['react', 'react-dom', '@types/react*', 'vue', '@vue/*', '@angular/*', 'ng-packagr']
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Angular-пакет держит свой TypeScript (того требует Angular) — обновляем вручную.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

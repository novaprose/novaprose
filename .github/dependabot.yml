# Automatic pull requests with dependency updates. Minor updates are grouped so they don't
# flood the repository: one pull request a week per group. Each one goes through the full CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      prosemirror:
        patterns: ['prosemirror-*', 'y-prosemirror', 'yjs', '@hocuspocus/*']
      frameworks:
        patterns:
          ['react', 'react-dom', '@types/react*', 'vue', '@vue/*', '@angular/*', 'ng-packagr']
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # The Angular package keeps its own TypeScript (Angular requires it): updated by hand.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

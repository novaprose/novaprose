name: Nightly

# Long checks that don't belong in every pull request:
#  - property-based tests on 20 000 random documents (XSS, stable HTML, external JSON).
# When one fails, fast-check prints the minimal example and the seed: turn it into a regular test.
on:
  schedule:
    - cron: '17 2 * * *' # every night, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-properties:
    name: Property-based tests (20 000 runs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:deep 20000

name: Nightly

# Long checks that don't belong in every pull request:
#  - property-based tests on 20 000 random documents (XSS, stable HTML, external JSON).
# When one fails, fast-check prints the minimal example and the seed: turn it into a regular test.
on:
  schedule:
    - cron: '17 2 * * *' # every night, 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-properties:
    name: Property-based tests (20 000 runs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:deep 20000

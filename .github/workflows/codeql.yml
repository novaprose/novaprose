name: CodeQL

# Статический анализ безопасности кода (XSS, prototype pollution, ReDoS, небезопасные регулярки).
# Найденное появляется в Security → Code scanning репозитория.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 3 * * 1' # раз в неделю — новые правила CodeQL на старом коде

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3

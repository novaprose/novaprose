name: Release

# Publishes to npm on a vX.Y.Z tag. No tokens: npm trusted publishing (OIDC).
# Every package on npmjs.com must trust this workflow: see docs/RELEASING.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile

      - name: Tag matches package versions
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION"; exit 1
          fi

      - run: pnpm check
      # Build, archives, size budget, publint + ESM/CJS types: before publishing, not after.
      - run: pnpm verify:release
      # Examples come from the same archives; their versions and CDN links point to the minor being released.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:examples --strict
      # Speed measurements with limits, as in CI.
      - run: pnpm perf

      - name: Publish to npm (core first)
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          for name in core collab react vue web-component angular tinymce-compat; do
            # A version that is already published is skipped, so rerunning the workflow is safe.
            if npm view "@novaprose/$name@$VERSION" version >/dev/null 2>&1; then
              echo "@novaprose/$name@$VERSION already published, skipping"; continue
            fi
            file=$(ls .release/novaprose-$name-*.tgz)
            echo "Publishing $file"
            npm publish "$file" --access public
          done

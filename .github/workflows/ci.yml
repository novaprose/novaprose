name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Новый пуш в ту же ветку/PR отменяет устаревший прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Действия закреплены по SHA коммита (защита цепочки поставок), версия — в комментарии.
# Обновляет их Dependabot (.github/dependabot.yml).

jobs:
  check:
    name: Формат, линт, типы, юнит-тесты с покрытием
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Пороги покрытия — в vitest.config.ts: упадёт, если покрытие снизилось.
      - run: pnpm test:coverage
      - run: node apps/site/scripts/sync-docs.mjs --check
      - name: Покрытие в сводку прогона
        if: always()
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;
          const row=(k)=>'| '+k+' | '+t[k].pct+'% |';
          console.log(['### Покрытие тестами','| | |','|---|---|',row('lines'),row('branches'),row('functions')].join('\n'))" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Сборка, бюджет размера, проверка пакетов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Сборка + архивы как для npm, бюджет размера (gzip), publint + проверка типов ESM/CJS.
      - run: pnpm verify:release
      - name: Размер в сводку прогона
        if: always()
        run: |
          echo '### Размер (gzip)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/size.mjs >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Браузерные тесты (Chromium, Firefox, WebKit, мобильный) + доступность
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # CDN-сборка слоя совместимости — для e2e «замена tinymce.min.js».
      - run: pnpm --filter "@novaprose/tinymce-compat..." build
      - run: pnpm e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

name: CI

on:
  push:
    branches: [main, 'night/**']
  pull_request:

permissions:
  contents: read

# A new push to the same branch or pull request cancels the outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to a commit SHA (supply chain protection), the version is in a comment.
# Dependabot updates them (.github/dependabot.yml).

jobs:
  check:
    name: Format, lint, types, unit tests with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Coverage thresholds live in vitest.config.ts: this fails if coverage went down.
      - run: pnpm test:coverage
      - run: node apps/site/scripts/sync-docs.mjs --check
      - name: Coverage in the run summary
        if: always()
        run: |
          node -e "const t=require('./coverage/coverage-summary.json').total;
          const row=(k)=>'| '+k+' | '+t[k].pct+'% |';
          console.log(['### Test coverage','| | |','|---|---|',row('lines'),row('branches'),row('functions')].join('\n'))" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Build, size budget, package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build + archives as for npm, size budget (gzip), publint + ESM/CJS type checks.
      - run: pnpm verify:release
      # Examples (examples/) from these archives: Vite build (React, Vue), the CDN file, Node; checked in Chromium.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:examples
      # Speed measurements on the same CDN build (Chromium): limits catch regressions, the table goes to the summary.
      - run: pnpm perf
      - name: Size in the run summary
        if: always()
        run: |
          echo '### Size (gzip)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/size.mjs >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Browser tests (Chromium, Firefox, WebKit, mobile) + accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      # CDN build of the compatibility layer, for the "tinymce.min.js drop-in" e2e tests.
      - run: pnpm --filter "@novaprose/tinymce-compat..." build
      - run: pnpm e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

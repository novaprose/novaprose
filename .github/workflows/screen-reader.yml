name: Screen reader

# NVDA on Windows reads the playground editor: the announcements a blind user depends on (Ctrl+B says
# "Bold on", typing "- " says "Bulleted list", dialogs say their names). What NVDA said in each test is
# printed as notices on the run, so a failure can be read without a screen reader.
on:
  push:
    branches: [main, 'night/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nvda:
    name: NVDA + Chromium
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      # A portable NVDA with the Guidepup add-on, the version @guidepup/guidepup expects, checked
      # against its SHA-256. --ignore-scripts: the tool depends on ffmpeg for screen recording, which
      # isn't used here, and its install script would download it.
      - run: npx --yes --ignore-scripts @guidepup/setup@0.29.3 install nvda
      - run: pnpm sr
      - name: What NVDA said
        if: always()
        run: node screen-reader/report.mjs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screen-reader-results
          path: screen-reader/test-results
          retention-days: 7

  voiceover:
    name: VoiceOver + WebKit
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install webkit
      # Lets VoiceOver be driven by AppleScript (the runner allows the needed system settings), then
      # the assets this version of @guidepup/guidepup expects. --ignore-scripts: no screen-recording
      # tool is downloaded, as for NVDA.
      - run: npx --yes --ignore-scripts @guidepup/setup@0.29.3 setup --ci
      - run: npx --yes --ignore-scripts @guidepup/setup@0.29.3 install voiceover
      - run: pnpm sr:voiceover
      - name: What VoiceOver said
        if: always()
        run: node screen-reader/report.mjs VoiceOver
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voiceover-results
          path: screen-reader/test-results
          retention-days: 7

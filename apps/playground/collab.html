<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaProse: real-time collaboration</title>
    <script type="module" src="/src/collab/main.ts"></script>
  </head>
  <body>
    <main class="pg-react">
      <h1>NovaProse <span class="pg-badge">Collab</span></h1>
      <p>
        Two editors in one room through the local sync server (<code
          >pnpm --filter @novaprose/sync-server dev</code
        >). Open the page in two tabs and there will be more participants.
      </p>
      <p>
        Room: <code id="room"></code> · Status: <output id="status">connecting</output> · Loaded:
        <output id="synced">0</output>/2
      </p>
      <section class="pg-collab" aria-label="Participants">
        <div>
          <h2>Anna</h2>
          <div id="anna"></div>
        </div>
        <div>
          <h2>Boris</h2>
          <div id="boris"></div>
        </div>
      </section>
    </main>
  </body>
</html>

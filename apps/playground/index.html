<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NovaProse — playground</title>
  </head>
  <body>
    <header class="pg-header">
      <h1>NovaProse <span class="pg-badge">playground</span></h1>
      <div class="pg-controls">
        <label><input type="checkbox" id="readonly" /> Read only</label>
        <select id="theme" aria-label="Theme">
          <option value="auto">Theme: auto</option>
          <option value="light">Theme: light</option>
          <option value="dark">Theme: dark</option>
        </select>
        <button type="button" id="reset">Reset</button>
      </div>
    </header>
    <main class="pg-main">
      <section id="editor"></section>
      <section class="pg-output">
        <div class="pg-tabs" role="tablist">
          <button type="button" role="tab" data-tab="html" aria-selected="true">HTML</button>
          <button type="button" role="tab" data-tab="json" aria-selected="false">JSON</button>
        </div>
        <pre id="output"></pre>
        <p class="pg-stats" id="stats"></p>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

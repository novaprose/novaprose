# Сервер синхронизации NovaProse + Caddy (HTTPS от Let's Encrypt).
# На сервере: /opt/novaprose/{compose.yml,Caddyfile,.env,sync-server/}; запуск — docker compose up -d --build.
# .env: SYNC_DOMAIN, NOVA_SYNC_SECRET, NOVA_SYNC_PUBLIC_PREFIX — не коммитить.
services:
  sync:
    build: ./sync-server
    restart: unless-stopped
    environment:
      NOVA_SYNC_SECRET: ${NOVA_SYNC_SECRET:?set NOVA_SYNC_SECRET in .env}
      NOVA_SYNC_PUBLIC_PREFIX: ${NOVA_SYNC_PUBLIC_PREFIX:-}
    volumes:
      - sync-data:/data
    # Наружу не публикуется: доступ только через Caddy.
    expose:
      - '1234'
    mem_limit: 768m
    logging:
      options: { max-size: '10m', max-file: '3' }

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [sync]
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      SYNC_DOMAIN: ${SYNC_DOMAIN:?set SYNC_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      options: { max-size: '10m', max-file: '3' }

volumes:
  sync-data:
  caddy-data:
  caddy-config:
